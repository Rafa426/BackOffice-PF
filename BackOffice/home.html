<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - DevBoard</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/guard.js"></script>
</head>
<body>

  <header class="barra">
    <a class="logo" href="home.html">&gt;_ DevBoard</a>
    <nav>
      <a class="boton-salir" id="btn-salir" href="login.html">Cerrar sesion</a>
    </nav>
  </header>

  <main class="contenido">
        <div class="titulo-seccion">
      <div>
        <h1>Mis proyectos</h1>
        <p>Los proyectos que se muestran en tu portafolio.</p>
      </div>
      <button type="button" class="boton-chico" id="btn-agregar">Agregar proyecto</button>
    </div>

    <section class="formulario-proyecto oculto" id="seccion-form">
      <h2 id="titulo-form">Nuevo proyecto</h2>
      <form id="form-proyecto">
        <label for="titulo">Titulo</label>
        <input type="text" id="titulo" minlength="3" maxlength="100" required>

        <label for="descripcion">Descripcion</label>
        <textarea id="descripcion" rows="4" minlength="3" maxlength="1024" required></textarea>

        <label for="repositorio">Repositorio (opcional)</label>
        <input type="url" id="repositorio" minlength="10" maxlength="300">

        <label for="tecnologias">Tecnologias</label>
        <input type="text" id="tecnologias">
        <p class="ayuda">Separadas por coma, por ejemplo: HTML, CSS, JS</p>

        <div class="botones-form">
          <button type="submit" class="boton-chico">Guardar</button>
          <button type="button" class="boton-cancelar" id="btn-cancelar">Cancelar</button>
        </div>
        <p class="mensaje" id="mensaje"></p>
      </form>
    </section>

    <section class="panel" id="panel">
      <p class="vacio">Todavia no tienes proyectos</p>
    </section>
  </main>

  <script src="js/home.js"></script>
</body>
</html>
